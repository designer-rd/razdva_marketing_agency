<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" role="img" aria-labelledby="title desc">
  <title id="title">Trust funnel visual</title>
  <desc id="desc">Conceptual funnel from blogger traffic to proof and marketplace purchase.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop stop-color="#171514"/><stop offset="1" stop-color="#9d5f55"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#3c2922" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1180" height="420" rx="54" fill="#fff8f4"/>
  <g filter="url(#s)" font-family="Arial, sans-serif" font-weight="700">
    <rect x="46" y="120" width="178" height="118" rx="32" fill="#fff"/>
    <text x="135" y="170" text-anchor="middle" font-size="24" fill="#171514">Блогер</text>
    <text x="135" y="204" text-anchor="middle" font-size="16" fill="#8a746b">создает интерес</text>
    <path d="M244 180h78" stroke="url(#g)" stroke-width="9" stroke-linecap="round"/>
    <path d="M306 160l28 20-28 20" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="342" y="120" width="178" height="118" rx="32" fill="#fff"/>
    <text x="431" y="170" text-anchor="middle" font-size="24" fill="#171514">Интерес</text>
    <text x="431" y="204" text-anchor="middle" font-size="16" fill="#8a746b">хочу посмотреть</text>
    <path d="M540 180h78" stroke="url(#g)" stroke-width="9" stroke-linecap="round"/>
    <path d="M602 160l28 20-28 20" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="638" y="98" width="208" height="162" rx="34" fill="#171514"/>
    <text x="742" y="156" text-anchor="middle" font-size="25" fill="#fff">Доказательства</text>
    <text x="742" y="194" text-anchor="middle" font-size="16" fill="#f0d5bd">UGC / отзывы / гарантия</text>
    <path d="M866 180h78" stroke="url(#g)" stroke-width="9" stroke-linecap="round"/>
    <path d="M928 160l28 20-28 20" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="964" y="120" width="170" height="118" rx="32" fill="#fff"/>
    <text x="1049" y="170" text-anchor="middle" font-size="24" fill="#171514">Kaspi/WB</text>
    <text x="1049" y="204" text-anchor="middle" font-size="16" fill="#8a746b">покупка</text>
  </g>
  <text x="590" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#6a5148">Смысл: между интересом и покупкой нужна управляемая зона доверия</text>
</svg>
